name: Native checks and bundles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/herdr-idle-inhibitor
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: target/release/herdr-idle-inhibitor
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/release/herdr-idle-inhibitor
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: target/release/herdr-idle-inhibitor.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Fix macOS SDK selection
        if: runner.os == 'macOS'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Record native baseline and reject accidental cross execution
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python -c 'import os, json; print(json.dumps({k:os.environ.get(k) for k in ["ImageOS","ImageVersion","RUNNER_OS","RUNNER_ARCH","GITHUB_SHA"]},indent=2))' > dist/runner-environment.json
          rustc -Vv > dist/toolchain.txt
          python -c 'import os,subprocess; actual=subprocess.check_output(["rustc","-vV"],text=True); assert "host: "+os.environ["EXPECTED_TARGET"] in actual,actual'
          if [ "$RUNNER_OS" = "macOS" ]; then
            sw_vers > dist/os-sdk.txt
            xcodebuild -version >> dist/os-sdk.txt
            xcrun --sdk macosx --show-sdk-version >> dist/os-sdk.txt
            test "$(xcrun --sdk macosx --show-sdk-version)" = "15.5"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            uname -a > dist/os-sdk.txt
            ldd --version >> dist/os-sdk.txt
          else
            cmd.exe /c ver > dist/os-sdk.txt
          fi
      - name: Validate workflow
        if: runner.os == 'Linux'
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/ci.yml
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked
      - name: Native request/assertion and notification lifecycle probes
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test --locked --lib -- --ignored
      - name: Packaging contract tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Release build
        run: cargo build --release --locked --target-dir target
      - name: Build-free bundle with checksums and matching vendored source
        run: python scripts/package.py --target ${{ matrix.target }} --binary ${{ matrix.binary }} --output dist
      - name: Verify unpacked executable and vendored source offline
        run: python scripts/verify_bundle.py --target ${{ matrix.target }} --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herdr-idle-inhibitor-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
